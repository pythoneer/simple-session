[package]
name = "simple-session"
version = "0.1.0"
edition = "2024"
description = "Save and restore GNOME window sessions"
license = "MIT"
repository = "https://github.com/pythoneer/simple-session"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
toml = "1.1.8"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
tempfile = "3.27.0"
